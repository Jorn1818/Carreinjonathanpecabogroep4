<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Details - PECABO</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .machine-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .machine-image img {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .machine-info h2 {
            margin-top: 0;
            font-size: 28px;
        }
        .machine-info p {
            margin: 10px 0;
            line-height: 1.6;
        }
        .specs-detail {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        .specs-detail p {
            margin: 8px 0;
        }
        .badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        /* action button styles */
        .action-container {
            margin-top: 20px;
        }
        .action-button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .action-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }
        .error {
            color: red;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 768px) {
            .machine-detail {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <h1>PECABO Machineverhuur</h1>
    </header>

    <div class="detail-container">
        <a href="index.html" class="back-link">← Terug naar overzicht</a>
        <div id="detail-content"></div>
    </div>

    <script>
        async function loadMachineDetail() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const contentDiv = document.getElementById('detail-content');
            
            console.log('URL:', window.location.href);
            console.log('Search:', window.location.search);
            console.log('ID from URL:', id);
            
            if (id === null || id === undefined || id === '') {
                contentDiv.innerHTML = '<div class="error">Geen machine ID opgegeven. <a href="index.html">Ga terug</a></div>';
                return;
            }

            try {
                // Fetch all machines and find the one with matching ID
                const response = await fetch('/api/machines');
                const machines = await response.json();
                // match by machine_id field from DB or index if not present
                const machine = machines.find(m => (m.machine_id ?? m.id ?? m.idx) == id);
                
                if (!machine) {
                    contentDiv.innerHTML = '<div class="error">Machine niet gevonden. <a href="index.html">Ga terug</a></div>';
                    return;
                }

                // Determine image
                let imgSrc = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" fill="%23eee"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%23999" font-size="24">Geen afbeelding</text></svg>';
                if (Array.isArray(machine.images) && machine.images.length) {
                    imgSrc = machine.images[0];
                } else if (typeof machine.images === 'string' && machine.images.trim()) {
                    imgSrc = machine.images.trim();
                }

                // determine availability: treat explicit false/"false" as unavailable
                const beschikbaar =
                    machine.beschikbaar === true ||
                    String(machine.beschikbaar).toLowerCase() === 'true';
                const name = machine.name || 'Onbekende machine';
                const description = machine.description || 'Geen beschrijving beschikbaar';
                const weight = machine.weight !== undefined ? `${machine.weight} ton` : 'Onbekend';
                const price = machine.price_per_day !== undefined ? `€${machine.price_per_day}/dag` : 'Prijs niet beschikbaar';
                const categorie = machine.type || 'Onbekend';

                contentDiv.innerHTML = `
                    <div class="machine-detail">
                        <div class="machine-image">
                            <img src="${imgSrc}" alt="${name}">
                        </div>
                        <div class="machine-info">
                            <h2>${name}</h2>
                            <p><strong>Beschrijving:</strong> ${description}</p>
                            <div class="specs-detail">
                                <p><strong>Categorie:</strong> ${categorie}</p>
                                <p><strong>Gewicht:</strong> ${weight}</p>
                                <p><strong>Prijs per dag:</strong> ${price}</p>
                            </div>
                            <div id="options-container" class="specs-detail">
                                <h3>Opties</h3>
                                <p id="options-loading">Opties laden...</p>
                            </div>
                            <div class="action-container">
                                ${beschikbaar
                                    ? '<button id="pay-button" class="action-button verhuurd-button" disabled>Verhuurd</button>'
                                    : '<button id="rented-button" class="action-button betaal-button" enabled>Betaal</button>'}
                            </div>
                        </div>
                    </div>
                `;

                // Load linked options for this machine
                loadMachineOptions(id);

                // Handle option state and payment navigation
                const navigateToPayment = () => {
                    const selectedOptionIds = getSelectedOptionIds();
                    const optionsQuery = encodeURIComponent(JSON.stringify(selectedOptionIds));
                    window.location.href = `betaal.html?id=${id}&options=${optionsQuery}`;
                };

                const payBtn = document.getElementById('pay-button');
                const rentedBtn = document.getElementById('rented-button');
                if (payBtn) {
                    payBtn.addEventListener('click', navigateToPayment);
                }
                if (rentedBtn) {
                    rentedBtn.addEventListener('click', navigateToPayment);
                }
            } catch (error) {
                console.error('Error loading machine:', error);
                contentDiv.innerHTML ='<div class="error">Fout bij het laden van de machine.<a href="index.html">Ga terug</a></div>';
            }
        }

        async function loadMachineOptions(machineId) {
            const optionsContainer = document.getElementById('options-container');
            const loadingEl = document.getElementById('options-loading');
            if (!optionsContainer) return;

            try {
                const response = await fetch(`/api/options?machine_id=${encodeURIComponent(machineId)}`);
                const options = await response.json();

                if (!Array.isArray(options) || options.length === 0) {
                    optionsContainer.innerHTML = '<p>Geen opties beschikbaar voor deze machine.</p>';
                    return;
                }

                optionsContainer.innerHTML = '<h3>Opties</h3>' + options.map((opt) => {
                    const extra = (opt.extra_price !== null && opt.extra_price !== undefined && Number(opt.extra_price) !== 0)
                        ? ` (+€${Number(opt.extra_price).toFixed(2)})`
                        : '';
                    return `
                    <label>
                        <input type="checkbox" name="machine-option" data-option-id="${opt.option_id}" value="${opt.option_id}" />
                        ${opt.name}${extra}
                    </label>`;
                }).join('<br>');

                // Clear intermediate loading text if it was present.
                if (loadingEl) loadingEl.remove();
            } catch (err) {
                console.error('Error loading options:', err);
                optionsContainer.innerHTML = '<p>Opties konden niet worden geladen.</p>';
            }
        }

        function getSelectedOptionIds() {
            return Array.from(document.querySelectorAll('input[name="machine-option"]:checked')).map(el => el.dataset.optionId);
        }

        // Load the machine details when the page loads
        loadMachineDetail();
    </script>
</body>
</html>
